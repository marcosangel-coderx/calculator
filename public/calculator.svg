<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Calculator body -->
  <rect x="15" y="10" width="70" height="80" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
  
  <!-- Display screen -->
  <rect x="22" y="18" width="56" height="16" rx="3" fill="#FEE2E2" stroke="#991B1B" stroke-width="1"/>
  
  <!-- Display text -->
  <text x="75" y="29" font-family="Arial, sans-serif" font-size="10" fill="#DC2626" text-anchor="end" font-weight="bold">123</text>
  
  <!-- Button grid (4x4) -->
  <!-- Row 1 -->
  <rect x="22" y="40" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="36" y="40" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="50" y="40" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="64" y="40" width="11" height="9" rx="2" fill="#FECACA"/>
  
  <!-- Row 2 -->
  <rect x="22" y="52" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="36" y="52" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="50" y="52" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="64" y="52" width="11" height="9" rx="2" fill="#FECACA"/>
  
  <!-- Row 3 -->
  <rect x="22" y="64" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="36" y="64" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="50" y="64" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="64" y="64" width="11" height="9" rx="2" fill="#FECACA"/>
  
  <!-- Row 4 -->
  <rect x="22" y="76" width="25" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="50" y="76" width="11" height="9" rx="2" fill="#FEE2E2"/>
  <rect x="64" y="76" width="11" height="9" rx="2" fill="#F87171"/>
  
  <!-- Button labels (simplified) -->
  <text x="27.5" y="47" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">7</text>
  <text x="41.5" y="47" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">8</text>
  <text x="55.5" y="47" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">9</text>
  <text x="69.5" y="47" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">÷</text>
  
  <text x="27.5" y="59" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">4</text>
  <text x="41.5" y="59" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">5</text>
  <text x="55.5" y="59" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">6</text>
  <text x="69.5" y="59" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">×</text>
  
  <text x="27.5" y="71" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">1</text>
  <text x="41.5" y="71" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">2</text>
  <text x="55.5" y="71" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">3</text>
  <text x="69.5" y="71" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">-</text>
  
  <text x="34.5" y="83" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">0</text>
  <text x="55.5" y="83" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">.</text>
  <text x="69.5" y="83" font-family="Arial, sans-serif" font-size="6" fill="#DC2626" text-anchor="middle" font-weight="bold">+</text>
